name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  agent-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-example/package-lock.json
      - run: npm ci
        working-directory: agent-example
      - run: npm test
        working-directory: agent-example

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The Docker image builds web/ in a context where only web/ and sdk/src/flags.js
      # exist — a checkout-root build can pass while the image fails. Replicate that layout.
      - name: Build web the way the Docker image does
        run: |
          rm -rf /tmp/dsim && mkdir -p /tmp/dsim/app/sdk/src
          cp -r web /tmp/dsim/app/web
          cp sdk/src/flags.js /tmp/dsim/app/sdk/src/flags.js
          rm -rf /tmp/dsim/app/web/node_modules
          ln -s "$PWD/web/node_modules" /tmp/dsim/app/web/node_modules
          cd /tmp/dsim/app/web && npm run build
