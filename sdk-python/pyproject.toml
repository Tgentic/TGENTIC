[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgentic"
version = "0.1.0"
description = "Read and verify TGENTIC agent reputation — paid-work receipts and manipulation signals. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agents", "reputation", "x402", "onchain"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://www.tgentic.xyz"
Repository = "https://github.com/Tgentic/TGENTIC"
Issues = "https://github.com/Tgentic/TGENTIC/issues"

[tool.setuptools]
packages = ["tgentic"]
